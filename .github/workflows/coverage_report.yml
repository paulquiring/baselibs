name: Code Coverage
permissions:
  contents: read
on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
  merge_group:
    types: [checks_requested]
  workflow_call:
jobs:
  coverage-report:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Free Disk Space (Ubuntu)
        uses: eclipse-score/cicd-workflows/.github/actions/free_disk_space@7b265b4accb24997dcb0de449c34d23853709f57
      - name: Install lcov
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.job }}
          repository-cache: true
          cache-save: ${{ github.event_name == 'push' }}
      - name: Run Bazel Coverage
        run: |
          bazel coverage --config=bl-x86_64-linux -- //score/... \
          -//score/language/safecpp/aborts_upon_exception:abortsuponexception_toolchain_test
      - name: Generate HTML Coverage Report
        run: |
          TRACEFILE="$(bazel info output_path)/_coverage/_coverage_report.dat"
          EXECROOT="$(bazel info execution_root)"

          genhtml "$TRACEFILE" \
            -o=cpp_coverage \
            --show-details \
            --source-directory="$EXECROOT" \
            --legend \
            --function-coverage \
            --branch-coverage \
            --ignore-errors negative
        shell: bash
      - name: Verify external coverage pages are generated
        run: |
          TRACEFILE="$(bazel info output_path)/_coverage/_coverage_report.dat"
          EXECROOT="$(bazel info execution_root)"
          EXECROOT_RELATIVE="${EXECROOT#/}"
          EXTERNAL_HTML_DIR="cpp_coverage/${EXECROOT_RELATIVE}/external"

          if grep -qE '^SF:.*/external/' "$TRACEFILE"; then
            if [[ ! -d "$EXTERNAL_HTML_DIR" ]]; then
              echo "::error::Expected external coverage pages under '$EXTERNAL_HTML_DIR' but directory is missing."
              exit 1
            fi

            EXTERNAL_INDEX_COUNT=$(find "$EXTERNAL_HTML_DIR" -name 'index.html' | wc -l)
            if [[ "$EXTERNAL_INDEX_COUNT" -eq 0 ]]; then
              echo "::error::No external coverage index pages were generated in '$EXTERNAL_HTML_DIR'."
              exit 1
            fi

            echo "Generated $EXTERNAL_INDEX_COUNT external coverage index page(s) under '$EXTERNAL_HTML_DIR'."
          fi
        shell: bash
      - name: Upload Coverage Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ github.event.repository.name }}_cpp_coverage_report
          path: cpp_coverage/
          include-hidden-files: true
          retention-days: 10
